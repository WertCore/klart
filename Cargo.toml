[workspace]
resolver = "3"
members = ["core", "cli", "tray"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WertCore/klart"
authors = ["klart contributors"]

[workspace.dependencies]
klart-core = { path = "core" }

[profile.release]
# A menu bar agent is resident for the whole login session, so its own footprint
# is part of the product. These cost compile time and buy back binary size.
lto = "thin"
codegen-units = 1
strip = "symbols"
