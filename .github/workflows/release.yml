name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Each platform builds its own artefact and a last job gathers them. Splitting
# it that way is not tidiness: a cross-compiled binary is one nothing has run
# the tests against, and the point of shipping Linux and Windows at all is that
# somebody can run them.
jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # A tag can point at any commit, including one that never went through a
      # pull request. Running the gates here is half a minute against the
      # alternative of a release built from a tree nothing checked.
      - name: Gates
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --exclude klart-tray-windows --all-targets --all-features -- -D warnings
          cargo test --workspace --exclude klart-tray-windows --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --exclude klart-tray-windows --no-deps

      - name: Bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          # `v1.2.3` is the tag; `1.2.3` is what goes in Info.plist. A manual run
          # has no tag, so it takes the version from the manifest.
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version=""
          fi
          ./scripts/bundle.sh $version
          plutil -lint dist/Klart.app/Contents/Info.plist
          echo "version=$(plutil -extract CFBundleShortVersionString raw dist/Klart.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          # `ditto` rather than `zip`: it is what preserves a bundle's structure
          # and permissions on macOS, and what Apple's own instructions use.
          ditto -c -k --keepParent dist/Klart.app \
            "dist/klart-${{ steps.bundle.outputs.version }}-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*.zip

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `klart-tray` is AppKit and `klart-tray-windows` is Win32, so the
      # portable half is named explicitly. The tests run here rather than being
      # taken on trust from another platform's run.
      - name: Gates
        run: |
          set -euo pipefail
          cargo clippy -p klart-core -p klart-cli -p klart-tray-common --all-targets --all-features -- -D warnings
          cargo test -p klart-core -p klart-cli -p klart-tray-common --all-features

      - name: Build and archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          cargo build --release -p klart-cli
          mkdir -p dist
          # `tar` preserves the executable bit, which a zip on Linux does not.
          tar -C target/release -czf "dist/klart-${version}-linux-x86_64.tar.gz" klart

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/*.tar.gz

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Gates
        run: |
          cargo clippy -p klart-core -p klart-cli -p klart-tray-common -p klart-tray-windows --all-targets --all-features -- -D warnings
          cargo test -p klart-core -p klart-cli -p klart-tray-common -p klart-tray-windows --all-features

      - name: Build and archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          cargo build --release -p klart-cli -p klart-tray-windows
          mkdir -p dist
          # Zip rather than tar: Explorer opens one without a third-party tool
          # and not the other. Both binaries go in, because one without the
          # other is a program that lists displays but cannot keep one dim.
          7z a "dist/klart-${version}-windows-x86_64.zip" ./target/release/klart.exe ./target/release/klart-tray.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/*.zip

  release:
    name: Release
    needs: [macos, linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the archives to it.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefacts

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file - \
            artefacts/*/* <<'NOTES'
          ## What runs where

          | | state |
          | --- | --- |
          | **macOS** | menu bar agent and command line, run on real hardware |
          | **Linux** | command line, compiled and tested by CI, **never run** |
          | **Windows** | command line and notification-area agent, compiled and tested by CI, and run on one Windows 11 machine; Windows 10 is untested |

          The menu bar is macOS's. Windows gets a notification-area agent of its
          own, which opens a hand-drawn panel rather than a menu because a Windows
          menu cannot hold a slider that is dragged. Linux still has no tray: a
          tray there is StatusNotifierItem over D-Bus or the legacy XEmbed
          protocol depending on the desktop, which is a new program rather than a
          build flag.

          That table is about platforms. Individual features can be newer than
          the hardware they have been tried on, and `PLAN.md` says so per feature:
          every entry there carries its own unticked boxes for the checks that
          still need a machine. It is worth a look before depending on something
          new.

          ## macOS

          Homebrew, which has nothing to undo afterwards:

          ```sh
          brew install wertcore/tap/klart   # no quarantine, nothing to unblock
          brew services start klart         # the agent holds gamma-dimmed displays
          ```

          `brew services` rather than `klart autostart`: autostart registers an
          application bundle with macOS, and a Homebrew install has no bundle —
          only the two binaries. `klart autostart` is for the app below.

          **Nothing to clear, and no flag to pass for it.** Homebrew's formula
          downloader does not set the quarantine attribute, so there is nothing
          to undo. It is applied by browsers and LaunchServices, which is why the
          archive below needs clearing and this does not.

          If you went looking for `--no-quarantine`: it was a *cask* option, it
          was deprecated in October 2025 and the last of it was removed from
          Homebrew in July 2026. Passing it to Homebrew 7 is `Error: invalid
          option`, whichever kind of package it is aimed at.

          ### Or the archive

          Unzip and move `Klart.app` to `/Applications`. It is **not signed or
          notarised**, and a browser put it there, so the first launch is
          refused. Either clear the attribute the browser set:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Klart.app
          ```

          or open it once, then approve it in System Settings → Privacy &
          Security, where macOS will be offering an **Open Anyway** button.
          Right-click and Open used to do this and no longer does: Apple removed
          that bypass for unsigned applications in macOS 15.

          Neither step exists on the Homebrew path above, which is the argument
          for taking it.

          The command line rides along inside the bundle:

          ```sh
          ln -s /Applications/Klart.app/Contents/MacOS/klart /usr/local/bin/klart
          klart autostart on   # this one does have a bundle to register
          ```

          Apple silicon only: the registry walk that finds a monitor's name and
          its I2C channel matches a class Intel Macs do not publish.

          ## Linux

          ```sh
          brew install wertcore/tap/klart   # x86_64, or:
          tar xzf klart-*-linux-x86_64.tar.gz && ./klart list
          ```

          Two permissions it will want, and neither is this program's to grant:

          - **external monitors** need read and write on `/dev/i2c-*`, which
            usually means being in the `i2c` group or a udev rule
          - **the laptop panel** needs write on
            `/sys/class/backlight/*/brightness`

          `klart probe` says which mechanism reached which display and why the
          others did not.

          There is no software fallback on Linux, because a gamma ramp needs a
          display server. A display neither mechanism reaches reports why rather
          than being dimmed badly.

          ## Windows

          Unzip both files somewhere permanent and run `klart-tray.exe`. It sits
          in the notification area — next to the sound icon on Windows 11 — and
          left or right clicking it opens a panel with a slider for each
          display, one for all of them, and the rows that keep their relative
          levels, start the agent at login, look for displays again, or quit. A
          wheel over a slider steps it by five percent.

          ```
          klart.exe list          # the command line, unchanged
          klart-tray.exe          # the agent; "Start at login" keeps it there
          ```

          The panel is drawn by the agent rather than assembled from menu items:
          a trackbar is a control with its own idea of a theme and does not look
          like the bar the macOS agent draws. Windows 11 rounds its corners;
          Windows 10 draws it square, the way its own flyouts are.

          Windows puts a new notification icon in the overflow area by design.
          On Windows 11 22H2 and later klart asks to be shown beside the clock on
          first run, and leaves the choice alone if you have hidden it in
          Settings; Windows 10 keeps it in the overflow until it is dragged out.
          A drag repaints immediately and the display is written on a background
          thread, so a DDC/CI link that takes a fifth of a second does not hold
          the pointer.

          Unsigned, so SmartScreen will warn on first run.

          ## If something does not work

          `klart probe` exists for that. It reports what was tried, what came
          back, and what it means — which of four causes, not merely that it
          failed.

          Linux has not been put through its paces on real hardware, and the
          Windows agent has been used on one machine. If either misbehaves, the
          probe output is the thing worth reporting.
          NOTES
