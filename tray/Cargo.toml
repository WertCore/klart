[package]
name = "klart-tray"
description = "Menu bar agent for klart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "klart-tray"
path = "src/main.rs"

[dependencies]
klart-core.workspace = true

# Apple-only, for the reason given in `core/Cargo.toml`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    # `statusItemWithLength` takes a `CGFloat` and `NSRect` comes from the same
    # place, so the geometry types have to come with it.
    "objc2-core-foundation",
    # `NSEvent::eventWithCGEvent`, the bridge used to decode a media key, is
    # gated on the core-graphics link.
    "objc2-core-graphics",
    # The on-screen level indicator rounds its panel with a CALayer.
    "objc2-quartz-core",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    # `NSBackingStoreType`, for the overlay window.
    "NSGraphics",
    # The overlay's brightness glyph: the system SF Symbol in an image view.
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSResponder",
    # `NSApplicationActivationPolicy` lives with the running-application types.
    "NSRunningApplication",
    # The level indicator's window: where it sits and which screen it sits on.
    "NSScreen",
    "NSSlider",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    # A status item's button has a window of its own, and its number is how a
    # scroll event is recognised as being over the icon.
    "NSWindow",
    # `NSWorkspace` is where the sleep and wake notifications are posted.
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSDate",
    "NSError",
    "NSGeometry",
    # `NSNotificationCenter` and `NSNotificationName`, for the wake observer.
    "NSNotification",
    "NSRunLoop",
    "NSString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    # The brightness-key takeover: an event tap and the events it carries.
    "CGEvent",
    "CGEventTypes",
    # The overlay's segment colours, set on their layers.
    "CGColor",
] }

# The overlay's rounded panel and its segmented bar: CALayers, coloured with
# CoreGraphics colours.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
] }

# The event tap needs a run loop to drive it and a mach port to feed it; the
# Accessibility prompt needs a small options dictionary. See `keys.rs`.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFRunLoop",
    "CFMachPort",
    "CFString",
    "CFDictionary",
    # `CFBoolean` and `kCFBooleanTrue` live with the number types.
    "CFNumber",
] }
